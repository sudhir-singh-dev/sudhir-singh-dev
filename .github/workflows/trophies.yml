name: Generate GitHub Trophies

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: sudhir-singh-dev
          output_path: assets/github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-trophies.svg
          git commit -m "Update GitHub trophy SVG" || echo "No changes to commit"
          git push
